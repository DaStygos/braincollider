{% extends "base_generic.html" %}

{% block title %}Déconnexion{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-5 text-center">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Vous êtes maintenant déconnecté</h1>
        <p class="text-muted mb-4">Vous pouvez vous reconnecter à tout moment ou revenir parcourir les problèmes.</p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
          <a class="btn btn-primary" href="{% url 'accounts:login' %}">Se reconnecter</a>
          <a class="btn btn-outline-secondary" href="{% url 'problems:index' %}">Retour aux problèmes</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

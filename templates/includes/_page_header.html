<div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
  <div>
    <h1 class="h3 mb-1">{{ title }}</h1>
    {% if subtitle %}
      <p class="text-muted mb-0">{{ subtitle }}</p>
    {% endif %}
  </div>
  {% if meta %}
    <div class="text-muted small">{{ meta }}</div>
  {% endif %}
</div>
